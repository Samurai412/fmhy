  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root.theme-christmas {

      --bg-card-hover: rgba(25, 68, 42, 0.85);
      --text-primary: #f0fdf4;
      --text-secondary: #86efac;
      --text-muted: #ef4444;
      --border: rgba(239, 68, 68, 0.3);
      --border-hover: #ef4444;
      --accent: #ef4444;
      --accent-glow: rgba(239, 68, 68, 0.25);
      --accent-border: rgba(239, 68, 68, 0.45);

    :root.theme-taz {
      --bg-primary: #140409;
      --bg-pill: rgba(38, 10, 18, 0.5);
      --bg-card: rgba(45, 12, 22, 0.6);
      --bg-card-hover: rgba(68, 18, 33, 0.85);
      --text-primary: #fff1f2;
      --text-secondary: #fecdd3;
      --text-muted: #f43f5e;
      --border: rgba(244, 63, 94, 0.3);
      --border-hover: #f43f5e;
      --accent: #f43f5e;
      --accent-glow: rgba(244, 63, 94, 0.25);
      --accent-border: rgba(244, 63, 94, 0.45);
      --orb-1: rgba(244, 63, 94, 0.4);
      --orb-2: rgba(225, 29, 72, 0.3);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Vibrant Glassmorphism Background Gradient Mesh Blobs */
    body::before {
      content: '';
      position: fixed;
      top: -15%;
      left: 5%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, var(--orb-1) 0%, transparent 70%);
      filter: blur(90px);
      z-index: -2;
      pointer-events: none;
      animation: orbFloat1 20s ease-in-out infinite alternate;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -10%;
      right: 5%;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, var(--orb-2) 0%, transparent 75%);
      filter: blur(100px);
      z-index: -2;
      pointer-events: none;
      animation: orbFloat2 24s ease-in-out infinite alternate-reverse;
    }
    @keyframes orbFloat1 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(70px, -50px) scale(1.12); }
      100% { transform: translate(-30px, 60px) scale(0.95); }
    }
    @keyframes orbFloat2 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-60px, 40px) scale(1.08); }
      100% { transform: translate(40px, -50px) scale(0.92); }
    }

    /* Frosted Liquid Glass Header Capsule */
    .nav-header {
      position: sticky;
      top: 24px;
      z-index: 100;
      max-width: 1200px;
      margin: 24px auto 48px auto;
      padding: 10px 24px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(32px) saturate(240%);
      -webkit-backdrop-filter: blur(32px) saturate(240%);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 
        inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.45),
        inset 0 -1.5px 1.5px 0 rgba(0, 0, 0, 0.35),
        0 20px 45px rgba(0, 0, 0, 0.5);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav-header:hover {
      background: rgba(255, 255, 255, 0.11);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 
        inset 0 2px 2px 0 rgba(255, 255, 255, 0.6),
        inset 0 -1.5px 1.5px 0 rgba(0, 0, 0, 0.4),
        0 25px 50px rgba(0, 0, 0, 0.6),
        0 0 25px var(--accent-glow);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .author-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.45);
    }
    .author-meta {
      display: flex;
      flex-direction: column;
    }
    .author-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .author-role {
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .nav-divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.2);
    }
    .site-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-input {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      padding: 6px 14px 6px 36px;
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
      width: 200px;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--accent);
      width: 240px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .search-icon {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .theme-selector { position: relative; }

    .theme-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }
    .theme-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .theme-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px;
      display: none;
      min-width: 170px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      z-index: 120;
    }
    .theme-menu.open { display: block; }

    .theme-option {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: left;
      transition: all 0.2s ease;
    }
    .theme-option:hover { background: var(--bg-card-hover); color: var(--text-primary); }
    .theme-option.active { background: var(--accent-glow); color: var(--accent); font-weight: 600; }

    .theme-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .theme-dot.dark { background: #070a12; border: 2px solid #10b981; }
    .theme-dot.light { background: #ffffff; border: 2px solid #059669; }
    .theme-dot.nonov { background: #0d0714; border: 2px solid #8b5cf6; }
    .theme-dot.lea { background: #061517; border: 2px solid #30D5C8; }
    .theme-dot.sakura { background: #180a11; border: 2px solid #ec4899; }
    .theme-dot.lain { background: #030a04; border: 2px solid #00ff41; }
    .theme-dot.atlas-dark { background: #030d07; border: 2px solid #22c55e; }
    .theme-dot.classic-light { background: #fbfbf9; border: 2px solid #2563eb; }
    .theme-dot.athenaeum { background: #120e0a; border: 2px solid #f59e0b; }
    .theme-dot.solo-leveling { background: #040914; border: 2px solid #3b82f6; }
    .theme-dot.christmas { background: #07150d; border: 2px solid #ef4444; }
    .theme-dot.taz { background: #140409; border: 2px solid #f43f5e; }

    /* Mobile Optimization */
    @media (max-width: 768px) {
      .nav-header {
        flex-direction: column;
        align-items: stretch;
        margin: 12px 12px 24px 12px;
        padding: 14px 18px;
        border-radius: 28px;
        gap: 12px;
      }
      .nav-left {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }
      .author-role { display: none; }
      .site-title { font-size: 1rem; }
      .nav-category-tabs {
        width: 100%;
        display: flex;
        overflow-x: auto;
        white-space: nowrap;
        gap: 8px;
        padding: 4px 2px 8px 2px;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }
      .nav-category-tabs::-webkit-scrollbar { display: none; }
      .nav-tab {
        flex-shrink: 0;
        scroll-snap-align: start;
        padding: 6px 14px;
        font-size: 0.8rem;
      }
      .nav-right {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        justify-content: space-between;
      }
      .search-box { flex: 1; }
      .search-input { width: 100%; font-size: 0.85rem; }
      .search-input:focus { width: 100%; }
      .main-wrapper { padding: 0 16px 48px 16px; }
      .cards-grid { grid-template-columns: 1fr; gap: 16px; }
      .card { padding: 20px; min-height: 190px; }
      .card-title { font-size: 1.25rem; margin-bottom: 8px; }
      .card-excerpt { font-size: 0.88rem; margin-bottom: 16px; }
    }

    /* Liquid Capsule Navbar Category Tabs (Filters posts by tag) */
    .nav-category-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 4px;
      scrollbar-width: none;
    }
    .nav-category-tabs::-webkit-scrollbar { display: none; }
    .nav-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav-tab:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .nav-tab.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .main-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 80px 24px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 28px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 230px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .card:hover {
      transform: translateY(-6px);
      border-color: var(--border-hover);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 0 20px var(--accent-glow);
      background: var(--bg-card-hover);
    }

    .card-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    .card:hover .card-title {
      color: var(--accent);
    }

    .card-excerpt {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .card-date {
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      margin-left: 2px;
    }
    .pill-date, .pill-read {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 500;
    }
    .pill-tag {
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid var(--accent-border);
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 14px;
      margin-top: auto;
      font-size: 0.84rem;
      color: var(--text-muted);
    }
    .card-footer span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .read-more {
      color: var(--accent);
      font-weight: 600;
      transition: transform 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .card:hover .read-more {
      transform: translateX(4px);
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }
    .empty h3 { color: var(--text-primary); font-size: 1.35rem; margin-bottom: 8px; font-weight: 700; }
    .empty p { color: var(--text-secondary); font-size: 1rem; }

    .footer {
      text-align: center;
      margin-top: 64px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .footer a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer a:hover { color: var(--accent); }
  </style>
</head>
<body>

  <header class="nav-header">
    <div class="nav-left">
      <div class="author-badge">
        <div class="avatar">S</div>
        <div class="author-meta">
          <span class="author-name">Samurai412</span>
          <span class="author-role">Curator & Author</span>
        </div>
      </div>
      <div class="nav-divider"></div>
      <a href="index.html" class="site-title">Blog</a>
    </div>

    <!-- Category Filter Tabs directly inside Navbar Capsule -->
    <nav id="nav-category-tabs" class="nav-category-tabs"></nav>

    <div class="nav-right">
      <div class="search-box">
        <input type="text" id="search-input" class="search-input" placeholder="Search notes by title or tag..." />
      </div>
      <div class="theme-selector">
        <button class="theme-btn" onclick="toggleThemeMenu()">
          <span id="themeName">Dark</span>
        </button>
        <div class="theme-menu" id="themeMenu">
          <button class="theme-option active" onclick="setTheme('dark')" data-theme="dark"><span class="theme-dot dark"></span> Dark</button>
          <button class="theme-option" onclick="setTheme('light')" data-theme="light"><span class="theme-dot light"></span> Light</button>
          <button class="theme-option" onclick="setTheme('nonov')" data-theme="nonov"><span class="theme-dot nonov"></span> Nonov</button>
          <button class="theme-option" onclick="setTheme('lea')" data-theme="lea"><span class="theme-dot lea"></span> Lea</button>
          <button class="theme-option" onclick="setTheme('sakura')" data-theme="sakura"><span class="theme-dot sakura"></span> Sakura</button>
          <button class="theme-option" onclick="setTheme('lain')" data-theme="lain"><span class="theme-dot lain"></span> Lain</button>
          <button class="theme-option" onclick="setTheme('atlas-dark')" data-theme="atlas-dark"><span class="theme-dot atlas-dark"></span> ATLAS Dark</button>
          <button class="theme-option" onclick="setTheme('classic-light')" data-theme="classic-light"><span class="theme-dot classic-light"></span> Classic Light</button>
          <button class="theme-option" onclick="setTheme('athenaeum')" data-theme="athenaeum"><span class="theme-dot athenaeum"></span> Athenaeum</button>
          <button class="theme-option" onclick="setTheme('solo-leveling')" data-theme="solo-leveling"><span class="theme-dot solo-leveling"></span> Solo Leveling</button>
          <button class="theme-option" onclick="setTheme('christmas')" data-theme="christmas"><span class="theme-dot christmas"></span> Christmas</button>
          <button class="theme-option" onclick="setTheme('taz')" data-theme="taz"><span class="theme-dot taz"></span> Taz</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div id="lessons" class="cards-grid">
      <div class="empty">
        <h3>Loading collection...</h3>
      </div>
    </div>

    <!-- Guestbook Widget Section -->
    <section id="guestbook-section" style="margin-top: 56px; display: none;">
      <div class="card" style="padding: 32px;">
        <h3 id="guestbook-title" style="font-size: 1.4rem; font-weight: 700; color: var(--accent); margin-bottom: 20px;">Discussion &amp; Feedback</h3>
        <div id="guestbook-entries" style="margin-bottom: 24px; display: flex; flex-direction: column; gap: 12px;"></div>
        <div class="guestbook-form" style="border-top: 1px solid var(--border); padding-top: 20px;">
          <h4 style="font-size: 0.95rem; font-weight: 600; color: var(--text-primary); margin-bottom: 12px;">Leave a Message</h4>
          <input type="text" id="gbName" class="search-input" placeholder="Your Name" style="width: 100%; margin-bottom: 10px;" />
          <textarea id="gbMsg" class="search-input" placeholder="Leave a comment or thought..." style="width: 100%; min-height: 80px; border-radius: 14px; margin-bottom: 12px; font-family: inherit; resize: vertical;"></textarea>
          <button class="nav-tab active" onclick="submitGuestbookEntry()" style="padding: 8px 20px; cursor: pointer;">Submit Note</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p>Published with <a href="https://github.com/Samurai412/fmhy" target="_blank">ATLAS:Face</a></p>
    </footer>
  </main>

  <script>
    const GITHUB_USER = 'Samurai412';
    const REPO_NAME = 'fmhy';
    let allLessons = [];
    let activeTagList = null;

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    const themes = {
      dark: { name: 'Dark' },
      light: { name: 'Light' },
      nonov: { name: 'Nonov' },
      lea: { name: 'Lea' },
      sakura: { name: 'Sakura' },
      lain: { name: 'Lain' },
      'atlas-dark': { name: 'ATLAS Dark' },
      'classic-light': { name: 'Classic Light' },
      athenaeum: { name: 'Athenaeum' },
      'solo-leveling': { name: 'Solo Leveling' },
      christmas: { name: 'Christmas' },
      taz: { name: 'Taz' }
    };

    const urlParams = new URLSearchParams(window.location.search);
    let activeTag = urlParams.get('tag') || window.location.hash.replace('#', '') || 'all';
    let currentTheme = localStorage.getItem('atlas-theme') || 'dark';

    function setTheme(theme) {
      if (!themes[theme]) theme = 'dark';
      currentTheme = theme;
      try { localStorage.setItem('atlas-theme', theme); } catch(e){}
      
      document.documentElement.className = '';
      if (theme !== 'dark') {
        document.documentElement.classList.add('theme-' + theme);
      }
      
      const nameEl = document.getElementById('themeName');
      if (nameEl) nameEl.textContent = themes[theme].name;
      
      document.querySelectorAll('.theme-option').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === theme);
      });
      
      toggleThemeMenu(false);
    }

    function toggleThemeMenu(forceState) {
      const menu = document.getElementById('themeMenu');
      if (!menu) return;
      const shouldOpen = typeof forceState === 'boolean' ? forceState : !menu.classList.contains('open');
      menu.classList.toggle('open', shouldOpen);
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.theme-selector')) {
        toggleThemeMenu(false);
      }
    });

    setTheme(currentTheme);

    // Search and Filtering
    const searchInput = document.getElementById('search-input');
    if (searchInput) {
      searchInput.addEventListener('input', () => {
        filterAndRender();
      });
    }

    // Markdown & HTML cleaner for excerpt generation
    function cleanMarkdownExcerpt(str) {
      if (!str) return '';
      let s = str.replace(new RegExp('<[^>]*>', 'g'), ' ');
      s = s.replace(new RegExp('\x60\x60\x60[\s\S]*?\x60\x60\x60', 'g'), ' ');
      s = s.replace(new RegExp('\\$\$[\s\S]*?\\$\$', 'g'), ' ');
      s = s.replace(new RegExp('\\$[^$\n]+\\$', 'g'), ' ');
      s = s.replace(new RegExp('!\\u005B.*?\\u005D\\u0028.*?\\u0029', 'g'), '');
      s = s.replace(new RegExp('\\u005B(.*?)\\u005D\\u0028.*?\\u0029', 'g'), '$1');
      s = s.replace(new RegExp('[\\*_~\\x60#>]', 'g'), '');
      return s.replace(new RegExp('\\s+', 'g'), ' ').trim();
    }

    // Render Navigation Category Tabs with Post Counts
    function renderNavbarCategoryTabs(lessons, customNavJson = null) {
      const navTabsContainer = document.getElementById('nav-category-tabs');
      if (!navTabsContainer) return;

      const tagCountMap = {};
      lessons.forEach(l => {
        (l.tags || ['Notes']).forEach(t => {
          const norm = t.trim();
          tagCountMap[norm] = (tagCountMap[norm] || 0) + 1;
        });
      });

      let customTabs = [];
      if (Array.isArray(customNavJson) && customNavJson.length > 0) {
        customTabs = customNavJson.map(item => ({
          id: (item.title || 'tab').toLowerCase().replace(/s+/g, '-'),
          label: item.title || 'Tab',
          tags: Array.isArray(item.tags) ? item.tags : [item.title]
        }));
      } else {
        const savedConfig = localStorage.getItem('atlas-navbar-tabs-' + REPO_NAME);
        if (savedConfig) {
          try { customTabs = JSON.parse(savedConfig); } catch(e){}
        }
      }

      let tabs = [];
      if (customTabs && customTabs.length > 0) {
        tabs = [{ id: 'all', label: 'All Notes', tags: null, count: lessons.length }];
        customTabs.forEach(ct => {
          const matchingCount = lessons.filter(l => {
            return (l.tags || []).some(lt => ct.tags.some(t => t.toLowerCase() === lt.toLowerCase()));
          }).length;
          tabs.push({
            id: ct.id,
            label: ct.label,
            tags: ct.tags,
            count: matchingCount
          });
        });
      } else {
        const uniqueTags = Object.keys(tagCountMap);
        tabs = [
          { id: 'all', label: 'All Notes', tags: null, count: lessons.length },
          ...uniqueTags.map(t => ({
            id: t.toLowerCase().replace(/s+/g, '-'),
            label: t,
            tags: [t],
            count: tagCountMap[t] || 0
          }))
        ];
      }

      navTabsContainer.innerHTML = tabs.map(t => {
        const isActive = activeTag === t.id || (!activeTag && t.id === 'all');
        const dataTags = t.tags ? ' data-tags="' + escapeHtml(JSON.stringify(t.tags)) + '"' : '';
        return '<button class="nav-tab ' + (isActive ? 'active' : '') + '" data-tag="' + t.id + '"' + dataTags + ' onclick="filterByTab(this)">' +
          escapeHtml(t.label) +
          (t.count !== undefined ? ' <span class="badge">' + t.count + '</span>' : '') +
        '</button>';
      }).join('');
    }

    function filterByTab(buttonEl) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      buttonEl.classList.add('active');
      activeTag = buttonEl.getAttribute('data-tag');
      const rawTags = buttonEl.getAttribute('data-tags');
      activeTagList = rawTags ? JSON.parse(rawTags) : null;
      filterAndRender();
    }

    function filterAndRender() {
      const q = (document.getElementById('search-input') ? document.getElementById('search-input').value.toLowerCase() : '');
      const container = document.getElementById('lessons');
      if (!container) return;

      const filtered = allLessons.filter(l => {
        // Tag matching
        let matchesTag = false;
        if (!activeTag || activeTag === 'all') {
          matchesTag = true;
        } else if (activeTagList && activeTagList.length > 0) {
          matchesTag = (l.tags || []).some(lt => activeTagList.some(at => at.toLowerCase() === lt.toLowerCase()));
        } else {
          matchesTag = (l.tags || []).some(lt => lt.toLowerCase().replace(/s+/g, '-') === activeTag);
        }

        // Query matching
        const matchesQuery = !q || l.title.toLowerCase().includes(q) || l.excerpt.toLowerCase().includes(q) || (l.tags || []).some(t => t.toLowerCase().includes(q));
        return matchesTag && matchesQuery;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty"><h3>No matching notes found</h3><p>Try searching for different keywords or select another tab.</p></div>';
        return;
      }

      container.innerHTML = filtered.map(l => {
        const tagsHtml = (l.tags || ['Notes']).map(t => '<span class="pill-tag">' + escapeHtml(t) + '</span>').join(' ');
        return '<a href="' + l.filename + '" class="card">' +
          '<div>' +
            '<div class="card-meta">' +
              tagsHtml +
              '<span class="card-date">' + l.date + '</span>' +
            '</div>' +
            '<h2 class="card-title">' + escapeHtml(l.title) + '</h2>' +
            '<p class="card-excerpt">' + escapeHtml(l.excerpt) + '</p>' +
          '</div>' +
          '<div class="card-footer">' +
            '<span>' + l.readTime + '</span>' +
            '<span class="read-more">Read note →</span>' +
          '</div>' +
        '</a>';
      }).join('');
    }

    // Guestbook Loader & Renderer
    let guestbookData = { entries: [] };
    async function loadGuestbook() {
      const gbSection = document.getElementById('guestbook-section');
      try {
        const res = await fetch('./guestbook.json?v=' + Date.now());
        if (res.ok) {
          guestbookData = await res.json();
          if (gbSection) gbSection.style.display = 'block';
          renderGuestbookEntries();
          return;
        }
      } catch(e){}

      // Check local storage fallback
      try {
        const localSaved = localStorage.getItem('atlas-guestbook-local-' + REPO_NAME);
        if (localSaved) {
          guestbookData.entries = JSON.parse(localSaved);
          if (gbSection) gbSection.style.display = 'block';
          renderGuestbookEntries();
        }
      } catch(e){}
    }

    function renderGuestbookEntries() {
      const container = document.getElementById('guestbook-entries');
      if (!container) return;
      const entries = guestbookData.entries || [];
      if (entries.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem; font-style: italic;">No messages yet. Be the first to leave a comment!</p>';
        return;
      }
      container.innerHTML = entries.map(e => {
        return '<div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px;">' +
          '<div style="display: flex; justify-content: space-between; margin-bottom: 6px;">' +
            '<strong style="color: var(--accent); font-size: 0.9rem;">' + escapeHtml(e.author) + '</strong>' +
            '<span style="font-size: 0.75rem; color: var(--text-muted);">' + escapeHtml(e.date) + '</span>' +
          '</div>' +
          '<p style="font-size: 0.9rem; color: var(--text-primary); margin: 0;">' + escapeHtml(e.message) + '</p>' +
        '</div>';
      }).join('');
    }

    async function submitGuestbookEntry() {
      const name = document.getElementById('gbName').value.trim() || 'Anonymous';
      const msg = document.getElementById('gbMsg').value.trim();
      if (!msg) return alert('Please enter a message.');

      const entry = { author: name, message: msg, date: new Date().toLocaleDateString() };
      guestbookData.entries = guestbookData.entries || [];
      guestbookData.entries.unshift(entry);

      try {
        const localSaved = JSON.parse(localStorage.getItem('atlas-guestbook-local-' + REPO_NAME) || '[]');
        localSaved.unshift(entry);
        localStorage.setItem('atlas-guestbook-local-' + REPO_NAME, JSON.stringify(localSaved));
      } catch(e){}

      renderGuestbookEntries();

      const token = localStorage.getItem('atlas-github-pat') || localStorage.getItem('atlas-github-token');
      if (token) {
        try {
          let sha = null;
          const checkRes = await fetch('https://api.github.com/repos/' + GITHUB_USER + '/' + REPO_NAME + '/contents/guestbook.json', {
            headers: { 'Authorization': 'token ' + token }
          });
          if (checkRes.ok) sha = (await checkRes.json()).sha;

          const content = btoa(unescape(encodeURIComponent(JSON.stringify(guestbookData, null, 2))));
          const body = { message: 'New guestbook entry by ' + name, content: content };
          if (sha) body.sha = sha;

          await fetch('https://api.github.com/repos/' + GITHUB_USER + '/' + REPO_NAME + '/contents/guestbook.json', {
            method: 'PUT',
            headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
        } catch(e){}
      }

      document.getElementById('gbName').value = '';
      document.getElementById('gbMsg').value = '';
    }

    async function loadLessons() {
      const container = document.getElementById('lessons');
      try {
        // 1. Fetch navbar configuration from repo if available
        let customNavJson = null;
        try {
          const navResp = await fetch('./navbar.json?v=' + Date.now());
          if (navResp.ok) customNavJson = await navResp.json();
        } catch(e){}

        // 2. Fetch list of HTML note files
        let files = null;
        const treeResp = await fetch('https://api.github.com/repos/' + GITHUB_USER + '/' + REPO_NAME + '/git/trees/main');
        if (treeResp.ok) {
          const treeData = await treeResp.json();
          files = (treeData.tree || []).filter(f => f.path.endsWith('.html') && f.path !== 'index.html' && f.path !== 'admin.html' && f.type === 'blob').map(f => ({ name: f.path }));
        } else {
          const response = await fetch('https://api.github.com/repos/' + GITHUB_USER + '/' + REPO_NAME + '/contents');
          if (response.ok) {
            const rawFiles = await response.json();
            files = rawFiles.filter(f => f.name.endsWith('.html') && f.name !== 'index.html' && f.name !== 'admin.html' && f.type === 'file');
          }
        }

        if (!files || files.length === 0) {
          container.innerHTML = '<div class="empty"><h3>No notes published yet</h3><p>Publish a note from ATLAS:Face to get started!</p></div>';
          renderNavbarCategoryTabs([], customNavJson);
          return;
        }

        const lessonPromises = files.map(async f => {
          let title = f.name.replace('.html', '').replace(/-/g, ' ');
          title = title.charAt(0).toUpperCase() + title.slice(1);
          let tags = ['Notes'];
          let excerpt = 'Interactive module. Click to view.';
          let readTime = '3 min read';

          try {
            const res = await fetch('./' + f.name + '?v=' + Date.now());
            if (res.ok) {
              const text = await res.text();

              // Extract Tags
              const metaTags = text.match(new RegExp('<meta\\s+name="tags"\\s+content="([^"]+)"', 'i'));
              const scriptTags = text.match(new RegExp('window\\.LESSON_TAGS\\s*=\\s*(\\u005B[^\\u005D]+\\u005D)'));
              if (metaTags && metaTags[1]) {
                tags = metaTags[1].split(',').map(t => t.trim()).filter(Boolean);
              } else if (scriptTags && scriptTags[1]) {
                try {
                  const parsed = JSON.parse(scriptTags[1]);
                  if (Array.isArray(parsed) && parsed.length > 0) tags = parsed;
                } catch(e){}
              }

              // Extract Title
              const titleMatch = text.match(new RegExp('<title>([^<]+)</title>', 'i'));
              if (titleMatch && titleMatch[1]) {
                const cleanTitle = titleMatch[1].split('—')[0].split('-')[0].trim();
                if (cleanTitle) title = cleanTitle;
              }

              // Extract and clean excerpt
              const contentMatch = text.match(new RegExp('<div class="note-content[^"]*">([\\s\\S]*?)</div>', 'i'));
              let rawContent = contentMatch && contentMatch[1] ? contentMatch[1] : '';
              let cleanContent = cleanMarkdownExcerpt(rawContent);
              if (cleanContent) {
                excerpt = cleanContent.slice(0, 140) + (cleanContent.length > 140 ? '...' : '');
                const wordCount = (cleanContent.split(new RegExp('\\s+')).filter(Boolean)).length;
                readTime = Math.max(1, Math.ceil(wordCount / 180)) + ' min read';
              }
            }
          } catch(err) {
            console.warn('Could not load details for ' + f.name, err);
          }

          return {
            filename: f.name,
            title: title,
            excerpt: excerpt,
            date: new Date().toLocaleDateString(),
            readTime: readTime,
            tags: (tags && tags.length > 0) ? tags : ['Notes']
          };
        });

        allLessons = await Promise.all(lessonPromises);
        renderNavbarCategoryTabs(allLessons, customNavJson);
        filterAndRender();
        loadGuestbook();
      } catch (e) {
        console.error(e);
        container.innerHTML = '<div class="empty"><h3>Could not load collection</h3><p>Please try again later.</p></div>';
      }
    }
    
    loadLessons();
  </script>
</body>
</html>
